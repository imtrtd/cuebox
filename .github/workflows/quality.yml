name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_SECRET: ci-only-placeholder-secret-at-least-32-chars
      AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://cuebox:cuebox@localhost:5432/cuebox
      DATABASE_URL_UNPOOLED: postgresql://cuebox:cuebox@localhost:5432/cuebox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
